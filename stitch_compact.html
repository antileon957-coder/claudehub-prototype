<!DOCTYPE html>
<html lang="zh-CN" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Claude Workspace Hub - macOS Launcher HUD</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', '-apple-system', 'BlinkMacSystemFont', 'sans-serif'],
            mono: ['"JetBrains Mono"', 'ui-monospace', 'monospace']
          },
          colors: {
            obsidian: '#121316',
            terracotta: {
              DEFAULT: '#D97757',
              muted: '#B85E42',
              glow: 'rgba(217, 119, 87, 0.22)',
              surface: 'rgba(217, 119, 87, 0.10)'
            }
          }
        }
      }
    }
  </script>
  <style>
    body {
      background-color: #08090b;
      font-feature-settings: "cv02", "cv03", "cv04", "cv11";
      -webkit-font-smoothing: antialiased;
      user-select: none;
    }
    .hud-window {
      box-shadow: 0 30px 80px -15px rgba(0, 0, 0, 0.85),
                  0 0 0 1px rgba(255, 255, 255, 0.08),
                  0 1px 0 0 rgba(255, 255, 255, 0.15) inset;
    }
    .card-hover {
      transition: all 0.16s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .card-hover:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 24px -6px rgba(0, 0, 0, 0.65), 0 0 0 1px rgba(217, 119, 87, 0.35);
    }
    .kbd-tag {
      box-shadow: 0 1px 2px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.12);
    }
  </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4 bg-[#07080a] text-zinc-100 font-sans">

  <!-- Launcher HUD Window Container (720x290 Compact Aspect Ratio) -->
  <div class="hud-window w-[740px] h-[300px] bg-[#121316]/95 backdrop-blur-2xl rounded-2xl border border-white/[0.08] flex flex-col justify-between overflow-hidden relative shadow-2xl">
    
    <!-- Subtle Copper Ambient Glow on top corner -->
    <div class="absolute -top-16 -left-16 w-56 h-56 bg-terracotta/15 rounded-full blur-3xl pointer-events-none"></div>
    <div class="absolute -bottom-16 right-0 w-48 h-48 bg-terracotta/10 rounded-full blur-3xl pointer-events-none"></div>

    <!-- Top Bar: Traffic lights, App Title with Terracotta star, Proxy Status Pill -->
    <header class="h-[44px] px-4 flex items-center justify-between border-b border-white/[0.06] bg-white/[0.015] z-10 select-none">
      
      <!-- Traffic lights & Title -->
      <div class="flex items-center gap-3">
        <!-- macOS Traffic lights -->
        <div class="flex items-center gap-1.5 pr-2">
          <div class="w-3 h-3 rounded-full bg-[#FF5F56] border border-[#E0443E]/60 shadow-sm flex items-center justify-center group cursor-pointer">
            <span class="opacity-0 group-hover:opacity-100 text-[8px] text-[#4d0000] font-bold leading-none mb-[1px]">✕</span>
          </div>
          <div class="w-3 h-3 rounded-full bg-[#FFBD2E] border border-[#DEA123]/60 shadow-sm flex items-center justify-center group cursor-pointer">
            <span class="opacity-0 group-hover:opacity-100 text-[8px] text-[#4d3800] font-bold leading-none mb-[1px]">−</span>
          </div>
          <div class="w-3 h-3 rounded-full bg-[#27C93F] border border-[#1AAB29]/60 shadow-sm flex items-center justify-center group cursor-pointer">
            <span class="opacity-0 group-hover:opacity-100 text-[8px] text-[#003808] font-bold leading-none mb-[1px]">+</span>
          </div>
        </div>

        <div class="h-3 w-px bg-white/10 mx-0.5"></div>

        <!-- Window Title with Anthropic Copper Star -->
        <div class="flex items-center gap-2">
          <!-- Copper Anthropic Sparkle Symbol -->
          <svg class="w-4 h-4 text-[#D97757]" viewBox="0 0 24 24" fill="currentColor">
            <path d="M12 0L14.7 9.3L24 12L14.7 14.7L12 24L9.3 14.7L0 12L9.3 9.3L12 0Z"/>
          </svg>
          <span class="text-[13px] font-semibold tracking-tight text-zinc-100">Claude Workspace Hub</span>
          <span class="text-[10px] px-1.5 py-0.5 rounded bg-white/5 text-zinc-400 font-mono font-medium border border-white/5">v2.4</span>
        </div>
      </div>

      <!-- Right Side Status Pill: Proxy Locked -->
      <div class="flex items-center gap-2">
        <div class="flex items-center gap-1.5 px-2.5 py-1 rounded-full bg-[#181a1f] border border-white/10 shadow-inner text-[11px] font-mono text-zinc-300">
          <span class="relative flex h-2 w-2">
            <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span>
            <span class="relative inline-flex rounded-full h-2 w-2 bg-emerald-500"></span>
          </span>
          <span class="text-zinc-400">代理锁定:</span>
          <span class="text-emerald-400 font-medium">127.0.0.1:7897</span>
          <span class="text-zinc-500 text-[10px] ml-0.5 px-1 py-0.2 rounded bg-zinc-800/80">(USA Seattle 06)</span>
          <svg class="w-3 h-3 text-emerald-400/80 ml-0.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
            <path stroke-linecap="round" stroke-linejoin="round" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/>
          </svg>
        </div>
      </div>

    </header>

    <!-- Center Body: Exactly 4 vertical cards in a single horizontal row -->
    <main class="flex-1 px-4 py-2.5 grid grid-cols-4 gap-3 items-stretch z-10">

      <!-- Column 1: 专用 Chrome -->
      <div class="card-hover group relative flex flex-col justify-between p-3.5 rounded-xl bg-white/[0.03] border border-white/[0.07] hover:border-[#D97757]/45 hover:bg-white/[0.05] cursor-pointer">
        <!-- Top row: Chrome Icon & Shortcut Badge [1] -->
        <div class="flex items-start justify-between">
          <div class="w-8 h-8 rounded-lg bg-[#1a1c22] border border-white/10 flex items-center justify-center p-1.5 shadow-sm group-hover:scale-105 transition-transform">
            <!-- Google Chrome SVG Logo -->
            <svg class="w-5 h-5" viewBox="0 0 24 24">
              <circle cx="12" cy="12" r="4.2" fill="#FFFFFF"/>
              <path d="M12 2C7.8 2 4.2 4.5 2.6 8.2L6.8 15.5C6.3 14.5 6 13.3 6 12C6 8.7 8.7 6 12 6H21.5C19.4 3.5 15.9 2 12 2Z" fill="#EA4335"/>
              <path d="M21.5 6H12C14.1 6 15.9 7.1 16.9 8.8L12.7 16.1C13.2 16.3 13.6 16.5 14.2 16.5C16.8 16.5 19 14.6 19.3 12.1L21.5 8.3C21.9 9.4 22 10.7 22 12C22 9.8 21.8 7.8 21.5 6Z" fill="#FBBC05"/>
              <path d="M12.7 16.1L8.5 8.8C7.5 10.5 7.7 12.8 9.1 14.3L4.9 21.6C7 22.8 9.4 23.5 12 23.5C15.8 23.5 19.1 21.6 21.1 18.7L16.9 11.4C16.5 14.1 14.8 16 12.7 16.1Z" fill="#34A853"/>
              <circle cx="12" cy="12" r="3.2" fill="#1A73E8"/>
            </svg>
          </div>
          <span class="kbd-tag text-[11px] font-mono font-semibold px-1.5 py-0.5 rounded bg-zinc-800 text-zinc-300 border border-white/10 group-hover:border-[#D97757]/40 group-hover:text-amber-200 transition-colors">1</span>
        </div>

        <!-- Middle: Title & Sublabel -->
        <div class="my-1.5">
          <div class="flex items-center gap-1.5">
            <h3 class="text-[13px] font-semibold text-zinc-100 group-hover:text-white">专用 Chrome</h3>
            <span class="w-1.5 h-1.5 rounded-full bg-emerald-400"></span>
          </div>
          <p class="text-[10.5px] text-zinc-400 leading-tight mt-0.5 truncate">独立沙箱 · Claude.ai</p>
        </div>

        <!-- Bottom: Reset button pill (R) -->
        <div class="pt-1">
          <button class="w-full h-[26px] px-2 rounded-lg bg-white/[0.04] hover:bg-[#D97757]/20 border border-white/10 hover:border-[#D97757]/50 text-[10.5px] font-medium text-zinc-300 hover:text-white flex items-center justify-between transition-all">
            <span class="flex items-center gap-1">
              <svg class="w-3 h-3 text-[#D97757]" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.2">
                <path stroke-linecap="round" stroke-linejoin="round" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
              </svg>
              <span>重置环境</span>
            </span>
            <span class="text-[9px] font-mono px-1 py-0.2 rounded bg-black/40 text-zinc-400 border border-white/5">R</span>
          </button>
        </div>
      </div>

      <!-- Column 2: Claude Code -->
      <div class="card-hover group relative flex flex-col justify-between p-3.5 rounded-xl bg-white/[0.03] border border-white/[0.07] hover:border-[#D97757]/45 hover:bg-white/[0.05] cursor-pointer">
        <!-- Top row: Terminal Ghost Icon & Shortcut [2] -->
        <div class="flex items-start justify-between">
          <div class="w-8 h-8 rounded-lg bg-[#1a1c22] border border-white/10 flex items-center justify-center shadow-sm group-hover:scale-105 transition-transform text-[#D97757]">
            <!-- Terminal Ghost Icon -->
            <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="4 17 10 11 4 5"></polyline>
              <line x1="12" y1="19" x2="20" y2="19"></line>
            </svg>
          </div>
          <span class="kbd-tag text-[11px] font-mono font-semibold px-1.5 py-0.5 rounded bg-zinc-800 text-zinc-300 border border-white/10 group-hover:border-[#D97757]/40 group-hover:text-amber-200 transition-colors">2</span>
        </div>

        <!-- Middle: Title & Sublabel -->
        <div class="my-1.5">
          <div class="flex items-center gap-1.5">
            <h3 class="text-[13px] font-semibold text-zinc-100 group-hover:text-white">Claude Code</h3>
            <span class="text-[9px] px-1 py-0.2 rounded bg-terracotta-surface text-[#D97757] font-mono font-medium border border-terracotta/20">CLI</span>
          </div>
          <p class="text-[10.5px] text-zinc-400 leading-tight mt-0.5 truncate">CLI 智能编程助手</p>
        </div>

        <!-- Bottom: Action indicator -->
        <div class="pt-1">
          <div class="w-full h-[26px] px-2 rounded-lg bg-white/[0.02] border border-white/[0.06] text-[10.5px] text-zinc-400 flex items-center justify-between group-hover:border-[#D97757]/30 group-hover:text-zinc-200 transition-colors">
            <span class="flex items-center gap-1 font-mono text-[10px]">
              <span class="text-[#D97757]">&gt;_</span> iTerm / Terminal
            </span>
            <svg class="w-3 h-3 text-zinc-500 group-hover:text-[#D97757] group-hover:translate-x-0.5 transition-all" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7" />
            </svg>
          </div>
        </div>
      </div>

      <!-- Column 3: Claude 桌面版 -->
      <div class="card-hover group relative flex flex-col justify-between p-3.5 rounded-xl bg-white/[0.03] border border-white/[0.07] hover:border-[#D97757]/45 hover:bg-white/[0.05] cursor-pointer">
        <!-- Top row: Copper Anthropic Star Logo & Shortcut [3] -->
        <div class="flex items-start justify-between">
          <div class="w-8 h-8 rounded-lg bg-[#221815] border border-[#D97757]/30 flex items-center justify-center shadow-sm group-hover:scale-105 transition-transform text-[#D97757]">
            <!-- Anthropic 8-point Sparkle Star -->
            <svg class="w-4.5 h-4.5 text-[#D97757]" viewBox="0 0 24 24" fill="currentColor">
              <path d="M12 1L14.8 9.2L23 12L14.8 14.8L12 23L9.2 14.8L1 12L9.2 9.2L12 1Z"/>
            </svg>
          </div>
          <span class="kbd-tag text-[11px] font-mono font-semibold px-1.5 py-0.5 rounded bg-zinc-800 text-zinc-300 border border-white/10 group-hover:border-[#D97757]/40 group-hover:text-amber-200 transition-colors">3</span>
        </div>

        <!-- Middle: Title & Sublabel -->
        <div class="my-1.5">
          <div class="flex items-center gap-1.5">
            <h3 class="text-[13px] font-semibold text-zinc-100 group-hover:text-white">Claude 桌面版</h3>
            <span class="w-1.5 h-1.5 rounded-full bg-emerald-400"></span>
          </div>
          <p class="text-[10.5px] text-zinc-400 leading-tight mt-0.5 truncate">官方客户端 · 防泄露</p>
        </div>

        <!-- Bottom: Launch native app pill -->
        <div class="pt-1">
          <div class="w-full h-[26px] px-2 rounded-lg bg-white/[0.02] border border-white/[0.06] text-[10.5px] text-zinc-400 flex items-center justify-between group-hover:border-[#D97757]/30 group-hover:text-zinc-200 transition-colors">
            <span class="flex items-center gap-1 text-[10px]">
              <span class="w-1.5 h-1.5 rounded-full bg-[#D97757]"></span> 原生沙箱防护
            </span>
            <svg class="w-3 h-3 text-zinc-500 group-hover:text-[#D97757] group-hover:translate-x-0.5 transition-all" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14" />
            </svg>
          </div>
        </div>
      </div>

      <!-- Column 4: 清理旧账号 (Caution Rose Outline) -->
      <div class="card-hover group relative flex flex-col justify-between p-3.5 rounded-xl bg-rose-950/[0.08] border border-rose-500/25 hover:border-rose-400/50 hover:bg-rose-950/[0.16] cursor-pointer">
        <!-- Top row: User Shield Badge & Shortcut [4] -->
        <div class="flex items-start justify-between">
          <div class="w-8 h-8 rounded-lg bg-rose-950/40 border border-rose-500/30 flex items-center justify-center shadow-sm group-hover:scale-105 transition-transform text-rose-300">
            <!-- User Shield Icon -->
            <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
              <circle cx="12" cy="9" r="2.5"/>
            </svg>
          </div>
          <span class="kbd-tag text-[11px] font-mono font-semibold px-1.5 py-0.5 rounded bg-zinc-800 text-rose-300 border border-rose-500/30 group-hover:border-rose-400 group-hover:text-rose-100 transition-colors">4</span>
        </div>

        <!-- Middle: Title & Sublabel -->
        <div class="my-1.5">
          <div class="flex items-center gap-1.5">
            <h3 class="text-[13px] font-semibold text-rose-100 group-hover:text-white">清理旧账号</h3>
            <span class="text-[9px] px-1 py-0.2 rounded bg-rose-500/20 text-rose-300 font-mono font-medium border border-rose-500/30">CAUTION</span>
          </div>
          <p class="text-[10.5px] text-rose-200/60 leading-tight mt-0.5 truncate">解绑凭据 · 守恒MCP</p>
        </div>

        <!-- Bottom: Safe cleanup button -->
        <div class="pt-1">
          <div class="w-full h-[26px] px-2 rounded-lg bg-rose-500/10 hover:bg-rose-500/20 border border-rose-500/30 text-[10.5px] font-medium text-rose-200 flex items-center justify-between transition-colors">
            <span class="flex items-center gap-1 text-[10px]">
              <svg class="w-3 h-3 text-rose-300" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
              </svg>
              <span>安全清理</span>
            </span>
            <span class="text-[9px] font-mono opacity-70">按住 ⌥</span>
          </div>
        </div>
      </div>

    </main>

    <!-- Bottom Line: Keyboard shortcut hints -->
    <footer class="h-[36px] px-4 flex items-center justify-between border-t border-white/[0.06] bg-black/30 font-mono text-[10.5px] text-zinc-400 select-none z-10">
      <div class="flex items-center gap-3">
        <!-- [1] [2] [3] [4] 启动 -->
        <div class="flex items-center gap-1">
          <span class="px-1.5 py-0.5 rounded bg-zinc-800/90 border border-white/10 text-zinc-200 text-[10px] font-semibold">1</span>
          <span class="px-1.5 py-0.5 rounded bg-zinc-800/90 border border-white/10 text-zinc-200 text-[10px] font-semibold">2</span>
          <span class="px-1.5 py-0.5 rounded bg-zinc-800/90 border border-white/10 text-zinc-200 text-[10px] font-semibold">3</span>
          <span class="px-1.5 py-0.5 rounded bg-zinc-800/90 border border-white/10 text-zinc-200 text-[10px] font-semibold">4</span>
          <span class="text-zinc-300 ml-1">启动</span>
        </div>

        <span class="text-zinc-600">·</span>

        <!-- [R] 重置专用 Chrome -->
        <div class="flex items-center gap-1">
          <span class="px-1.5 py-0.5 rounded bg-zinc-800/90 border border-white/10 text-terracotta text-[10px] font-semibold">R</span>
          <span class="text-zinc-300">重置专用 Chrome</span>
        </div>

        <span class="text-zinc-600">·</span>

        <!-- [Esc] 退出 -->
        <div class="flex items-center gap-1">
          <span class="px-1.5 py-0.5 rounded bg-zinc-800/90 border border-white/10 text-zinc-400 text-[10px] font-semibold">Esc</span>
          <span class="text-zinc-400">退出</span>
        </div>
      </div>

      <!-- Right hint -->
      <div class="flex items-center gap-1.5 text-zinc-500">
        <svg class="w-3 h-3" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M15 15l-2 5L9 9l11 4-5 2zm0 0l5 5M7.188 2.239l.777 2.897M5.136 7.965l-2.898-.777M13.95 4.05l-2.122 2.122m-5.657 5.656l-2.12 2.122" />
        </svg>
        <span class="text-[10px]">支持鼠标点击</span>
      </div>
    </footer>

  </div>

</body>
</html>
